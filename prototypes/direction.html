<!DOCTYPE html>
<html lang="en" data-theme="dark" data-frame="desktop" data-shell="app">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype — Direction — Geeklogs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Direction prototype. Visual language from Restructure.
     Real files in apps/web/public are used for the logo, team, screenshots, and Pix QR.
     Catalog covers stay generated: the live app loads those from the catalogs. */
  :root {
    --bg: #f3efe7; --sunken: #e8e2d6; --surface: #fffcf8; --surface-2: #f6f1e8;
    --ink: #1c1915; --muted: #6b645b; --faint: #8a8176; --line: #e3dace;
    --accent: #0e6e6b; --accent-ink: #f3fffe; --star: #a8641a; --danger: #9d342c;
    --shadow: 0 1px 2px rgba(40, 32, 18, 0.05);
    --display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --font: "Outfit", system-ui, sans-serif;
    --rail: 104px; --radius: 14px; color-scheme: light;
    --asset: "../apps/web/public";
  }
  [data-theme="dark"] {
    --bg: #10120f; --sunken: #0c0e0b; --surface: #1a1d18; --surface-2: #23271f;
    --ink: #f4f0e8; --muted: #b3aca1; --faint: #8e877c; --line: #31362d;
    --accent: #7ee8df; --accent-ink: #06211f; --star: #f0b429; --danger: #ff9a92;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); background: var(--sunken); color: var(--ink); font-size: 15px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p { margin: 0; }
  img { max-width: 100%; }
  .proto { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: #1c1915; color: #f4f0e8; font-size: 12px; }
  .proto strong { font-weight: 650; }
  .proto .sp { flex: 1; min-width: 8px; }
  .proto button, .proto select { background: #2a2622; color: #f4f0e8; border: 1px solid #4a433b; border-radius: 8px; padding: 6px 8px; min-height: 32px; }
  .proto .state { color: #c9c0b4; }
  .stage { min-height: calc(100vh - 48px); }
  .app { position: relative; min-height: calc(100vh - 48px); background: var(--bg); }
  [data-frame="desktop"][data-shell="app"] .app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }
  [data-frame="desktop"][data-shell="app"] .sidebar { grid-column: 1; }
  [data-frame="desktop"][data-shell="app"] .column { grid-column: 2; min-width: 0; }
  [data-frame="phone"] .stage { width: 390px; height: min(820px, calc(100vh - 64px)); margin: 12px auto 24px; border: 8px solid #1c1915; border-radius: 32px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.28); background: var(--bg); }
  [data-frame="phone"] .app { position: relative; height: 100%; display: flex; flex-direction: column; min-height: 0; }
  [data-frame="phone"] .column { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  [data-frame="phone"] .content { flex: 1; overflow: auto; }
  [data-frame="desktop"] .phone-head, [data-frame="desktop"] .dock { display: none; }
  [data-frame="phone"] .sidebar { display: none; }
  [data-shell="plain"] .sidebar, [data-shell="plain"] .dock, [data-shell="plain"] .phone-head, [data-shell="plain"] .topbar { display: none !important; }
  [data-shell="plain"][data-frame="desktop"] .app { display: block; }
  [data-frame="phone"][data-shell="app"] .content { padding-bottom: 84px; }
  [data-frame="phone"] .topbar, [data-screen="search"] .topbar { display: none; }
  .sidebar { position: sticky; top: 48px; height: calc(100vh - 48px); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px 8px; gap: 4px; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 4px 12px; text-decoration: none; color: inherit; }
  .brand img { height: 32px; width: 32px; object-fit: contain; }
  .brand b { font-family: var(--display); font-size: 13px; font-weight: 650; letter-spacing: -0.03em; }
  .navbtn, .dock a, .textlink { background: none; border: 0; text-align: left; color: var(--ink); text-decoration: none; }
  .navbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 4px; border-radius: 12px; min-height: 64px; color: var(--muted); font-weight: 600; font-size: 11px; text-align: center; }
  .navbtn[aria-current="page"], .dock a[aria-current="page"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--ink); }
  .phone-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .phone-head b { font-family: var(--display); font-size: 20px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
  .topbar { padding: 16px 28px 0; }
  .content { padding: 18px 28px 48px; min-width: 0; }
  [data-frame="phone"] .content { padding: 14px 14px 24px; }
  .page-title { font-family: var(--display); font-size: 34px; font-weight: 560; letter-spacing: -0.03em; line-height: 1.1; }
  [data-frame="phone"] .page-title { font-size: 28px; }
  .lede { color: var(--muted); max-width: 46rem; }
  .kicker { font-size: 12px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spread { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-width: 0; overflow: hidden; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
  .btn.danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .chips { display: flex; gap: 6px; overflow: auto; padding-bottom: 2px; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 8px 12px; min-height: 36px; font-weight: 550; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field span, .field legend { font-size: 13px; font-weight: 600; }
  input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
  .row > select, .row > .btn { width: auto; min-width: 0; flex: none; }
  textarea { min-height: 96px; resize: vertical; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); font-size: 13px; }
  .search-launch { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 0 14px; color: var(--muted); }
  .cover { border-radius: 10px; display: grid; place-items: end start; padding: 8px; color: white; font-family: var(--display); font-weight: 650; letter-spacing: -0.03em; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .logs { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .logs.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .log { display: flex; gap: 12px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; color: inherit; min-width: 0; }
  .logs.list .cover { width: 64px; height: 96px; flex: none; font-size: 14px; }
  .logs.grid .log { flex-direction: column; }
  .logs.grid .cover { width: 100%; aspect-ratio: 2/3; font-size: 22px; }
  .log-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .log-top { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .log-top h3 { font-size: 16px; font-weight: 620; flex: 1 1 120px; min-width: 0; }
  .log-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .pill { flex: none; font-size: 11px; font-weight: 650; border-radius: 999px; padding: 3px 8px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .stars { color: var(--star); letter-spacing: 1px; font-size: 13px; background: none; border: 0; padding: 0; }
  .library { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
  [data-frame="phone"] .library { display: block; }
  [data-frame="phone"] .side-rail { display: none; }
  .side-rail { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 12px; }
  .continue, .shelf-row { display: flex; gap: 10px; overflow: auto; padding-bottom: 4px; }
  .continue .log { width: 320px; flex: none; }
  [data-frame="phone"] .continue .log { width: 88%; }
  .shelf-card { flex: none; width: 132px; display: flex; flex-direction: column; gap: 6px; text-align: left; background: none; border: 0; padding: 0; color: inherit; }
  .shelf-card .cover { width: 100%; aspect-ratio: 2/3; font-size: 22px; }
  .shelf-card h3 { font-size: 13px; font-weight: 620; line-height: 1.25; min-height: 2.5em; }
  .activity { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
  [data-frame="phone"] .activity { display: block; }
  .pane-toggle { display: none; }
  [data-frame="phone"] .pane-toggle { display: flex; }
  [data-frame="phone"] .activity.is-friends .numbers, [data-frame="phone"] .activity.is-numbers .friends { display: none; }
  .item-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 18px; align-items: start; }
  [data-frame="phone"] .item-grid { grid-template-columns: 1fr; }
  .hero { display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 18px; align-items: end; }
  [data-frame="phone"] .hero { grid-template-columns: 104px minmax(0, 1fr); gap: 12px; }
  .hero .cover { width: 100%; aspect-ratio: 2/3; font-size: 28px; }
  .tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
  .tabs button { flex: 1; min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 600; }
  .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
  .you, .team { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  [data-frame="phone"] .you, [data-frame="phone"] .team { grid-template-columns: 1fr 1fr; }
  .team article { padding: 0; overflow: hidden; }
  .team img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .team div { padding: 12px; text-align: center; }
  .about-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  [data-frame="phone"] .about-split, [data-frame="phone"] .plans { grid-template-columns: 1fr; }
  .shots { display: grid; grid-template-columns: 160px 160px; gap: 12px; }
  .shots img { border-radius: 16px; border: 1px solid var(--line); }
  .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  [data-frame="phone"] .market-grid { grid-template-columns: 1fr; }
  .dock { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 4; display: flex; gap: 2px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 18px; padding: 6px; }
  .dock a { flex: 1; min-height: 48px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; color: var(--muted); }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 8; }
  .overlay.on { display: flex; }
  [data-frame="desktop"] .overlay { position: fixed; top: 48px; }
  .sheet-back { align-items: flex-end; justify-content: center; }
  [data-frame="desktop"] .sheet-back { align-items: center; }
  .sheet { width: min(520px, 100%); background: var(--surface); border-radius: 18px 18px 0 0; padding: 12px 16px 20px; max-height: 86%; overflow: auto; }
  [data-frame="desktop"] .sheet { border-radius: 18px; max-height: 80%; }
  .drawer-back { justify-content: flex-end; }
  [data-frame="phone"] .drawer-back { align-items: flex-end; justify-content: center; }
  .drawer { width: min(400px, 100%); height: 100%; background: var(--surface); overflow: auto; padding: 16px 16px 28px; }
  [data-frame="phone"] .drawer { width: 100%; height: auto; max-height: 88%; border-radius: 18px 18px 0 0; }
  .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
  [data-frame="desktop"] .grab { display: none; }
  .checks { display: flex; flex-direction: column; gap: 4px; }
  .checks label { display: flex; gap: 10px; align-items: center; min-height: 40px; }
  .own { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .own button { min-height: 64px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 11px; font-weight: 650; }
  .own button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .lib-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .lib-head .btn { flex: none; }
  .lib-tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rate { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .rate-star { position: relative; width: 32px; height: 32px; flex: none; }
  .rate-star::before, .rate-star i { position: absolute; left: 0; top: 0; height: 32px; font-style: normal; font-size: 28px; line-height: 32px; pointer-events: none; }
  .rate-star::before { content: "★"; color: color-mix(in srgb, var(--ink) 28%, transparent); }
  .rate-star i { width: calc(var(--fill) * 100%); overflow: hidden; color: var(--star); }
  .rate-star i::before { content: "★"; }
  .rate-star button { position: absolute; top: 0; height: 100%; width: 50%; border: 0; background: transparent; padding: 0; z-index: 1; cursor: pointer; }
  .rate-star button:first-of-type { left: 0; }
  .rate-star button:last-of-type { right: 0; }
  .match-count { display: flex; gap: 8px; align-items: center; }
  .match-count input { max-width: 8rem; }
  .match-player { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .match-player .name { flex: 1 1 140px; min-width: 0; width: auto; }
  .match-player .score { width: 5.5rem; flex: none; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; flex: none; }
  .avatar.winner { box-shadow: 0 0 0 2px var(--star); }
  .toggle { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--surface-2); color: var(--muted); border-radius: 12px; min-height: 40px; padding: 6px 8px; }
  .toggle i { width: 28px; height: 16px; border-radius: 99px; background: var(--line); position: relative; flex: none; }
  .toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  .toggle[aria-pressed="true"] { color: var(--ink); }
  .toggle[aria-pressed="true"] i { background: var(--accent); }
  .toggle[aria-pressed="true"] i::after { left: 14px; }
  .match-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .match-actions .btn { flex: 1; }
  .history-head { display: flex; gap: 8px; align-items: center; width: 100%; background: none; border: 0; color: inherit; padding: 0; text-align: left; }
  .avatars { display: flex; flex: none; }
  .avatars .avatar { margin-left: -8px; box-shadow: 0 0 0 2px var(--surface); }
  .avatars .avatar:first-child { margin-left: 0; }
  .history-meta { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
  .history-row { display: flex; gap: 8px; align-items: center; }
  .history-row.winner { background: color-mix(in srgb, var(--star) 16%, transparent); border-radius: 12px; padding: 6px 8px; }
  .chev { color: var(--muted); flex: none; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .stat b { display: block; font-family: var(--display); font-size: 28px; font-weight: 560; letter-spacing: -0.03em; }
  .pace { display: flex; align-items: flex-end; gap: 6px; height: 148px; overflow: hidden; min-width: 0; }
  .pace span { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
  .pace i { display: block; width: 100%; height: min(calc(var(--h) * 1%), calc(100% - 16px)); border-radius: 6px 6px 2px 2px; background: var(--accent); }
  .pace em { font-style: normal; font-size: 10px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barline { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .barline i { display: block; height: 100%; width: var(--w); max-width: 100%; background: var(--accent); }
  .barline.sale i { background: #3f7d6a; }
  .donut { width: 112px; height: 112px; border-radius: 50%; flex: none; background: conic-gradient(var(--accent) 0 46%, #c9846a 46% 70%, var(--star) 70% 88%, var(--line) 88% 100%); }
  .legend { display: flex; flex-direction: column; gap: 6px; }
  .hof-row { display: flex; gap: 10px; align-items: center; }
  .hof-row .cover { width: 42px; height: 62px; font-size: 12px; flex: none; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal button { aspect-ratio: 1; border-radius: 8px; border: 1px solid transparent; background: var(--surface-2); font-size: 12px; min-width: 0; }
  .cal button.has { box-shadow: inset 0 -3px 0 var(--accent); }
  .listing { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; color: inherit; width: 100%; }
  [data-frame="phone"] .listing { grid-template-columns: 64px minmax(0, 1fr); }
  [data-frame="phone"] .listing .price { grid-column: 2; }
  .price { font-family: var(--display); font-size: 22px; }
  .auth-wrap { max-width: 420px; margin: 8vh auto; display: flex; flex-direction: column; gap: 14px; }
  .landing { max-width: 1040px; margin: 0 auto; padding: 48px 28px 64px; display: flex; flex-direction: column; gap: 36px; }
  [data-frame="phone"] .landing { padding: 28px 16px 40px; }
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .switch { width: 44px; height: 26px; border-radius: 99px; border: 0; background: var(--line); position: relative; flex: none; }
  .switch i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: white; }
  .switch[aria-pressed="true"] { background: var(--accent); }
  .switch[aria-pressed="true"] i { left: 21px; }
  .set-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 999px; font-size: 13px; z-index: 70; max-width: min(420px, 92vw); }
  .prose { display: flex; flex-direction: column; gap: 10px; max-width: 42rem; }
  .prose p, .prose li { color: var(--muted); }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details summary { cursor: pointer; font-weight: 600; }
  .discover-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 16px; }
  [data-frame="phone"] .discover-grid { grid-template-columns: 1fr; }
  .badge { min-width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 11px; display: inline-grid; place-items: center; padding: 0 5px; }
</style>
</head>
<body>
<div class="proto">
  <strong>PROTOTYPE · Direction</strong>
  <span>Restructure, with the live fields and assets. Nothing is saved.</span>
  <span class="sp"></span>
  <label>Screen <select id="jump"></select></label>
  <button type="button" id="theme-btn">Theme</button>
  <button type="button" id="frame-btn">Frame</button>
  <span class="state" id="state-line"></span>
</div>
<div class="stage">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="column">
      <header class="phone-head">
        <b>Geeklogs</b>
        <span class="faint" id="phone-screen"></span>
        <button type="button" class="icon-btn" id="search-quick" data-go="search" aria-label="Search catalogs"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/></svg></button>
      </header>

}
function draw() {
  const plain = ["landing","login","register","forgot","reset","onboarding"].includes(state.screen);
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.dataset.frame = state.frame;
  document.documentElement.dataset.shell = plain ? "plain" : "app";
  document.documentElement.dataset.screen = state.screen;
  const nav = state.authed ? APP_NAV : GUEST_NAV;
  const dock = state.authed ? APP_NAV : [["search","Search"],["dashboard","Library"],["plans","Plans"],["login","Log in"],["register","Register"]];
  document.getElementById("sidebar").innerHTML = shellNav(nav);
  document.getElementById("dock").innerHTML = dock.map(([id, label]) => `<a href="#" data-go="${id}" ${currentPlace()===id?'aria-current="page"':""}>${ICONS[id]||""}<span>${label}</span></a>`).join("");
  document.getElementById("main").innerHTML = VIEWS[state.screen]();
  document.getElementById("phone-screen").textContent = SCREENS.find((s) => s[0] === state.screen)[1];
  document.getElementById("search-quick").hidden = plain || state.screen === "search" || !state.authed;
  document.getElementById("jump").value = state.screen;
  document.getElementById("theme-btn").textContent = state.theme === "dark" ? "Dark" : "Light";
  document.getElementById("frame-btn").textContent = state.frame === "desktop" ? "Desktop" : "Phone";
  document.getElementById("state-line").textContent = `${SCREENS.find((s) => s[0] === state.screen)[1]} · ${catName(state.cat) || "All"} · ${state.theme} · ${state.frame}`;
  document.getElementById("sheet").classList.toggle("on", !!state.sheet);
  document.getElementById("sheet-title").textContent = state.sheet === "match" ? "Log a match" : (state.focus ? state.focus : "Log");
  if (state.sheet) {
    const cat = state.cat === "all" ? "movies" : shownCat();
    document.getElementById("sheet-body").innerHTML = state.sheet === "recap" ? recapBody() : state.sheet === "match" ? matchSheet() : formFields(cat);
  }
  document.getElementById("drawer").classList.toggle("on", state.drawer);
  if (state.drawer) document.getElementById("drawer-body").innerHTML = drawerBody();
}
document.getElementById("jump").innerHTML = SCREENS.map(([id, label]) => `<option value="${id}">${label}</option>`).join("");
document.body.addEventListener("click", (e) => {
  syncDraft();
  const t = e.target.closest("[data-go],[data-cat],[data-layout],[data-lib],[data-pane],[data-see],[data-market],[data-market-go],[data-log-match],[data-log],[data-open-item],[data-toast],[data-switch],[data-day],[data-rate],[data-own],[data-add-match],[data-add-player],[data-remove-player],[data-winner],[data-pick-date],[data-open-match],[data-delete-match],[data-confirm-delete],[data-cancel-delete],[data-save-match],[data-save-banner],[data-tab],[data-pace],[data-period],[data-spend],[data-discover],[data-player],[data-clear],#theme-btn,#frame-btn,#sheet-close,#save-log,#open-filters,#drawer-close,#apply-filters,#clear-filters,#open-recap,#refresh-discover,#ob-next,#ob-back,#ob-light,#ob-dark,#set-light,#set-dark,#cookie-ok");
  if (!t) return;
  if (t.id === "sheet-close") { state.sheet = false; draw(); return; }
  if (t.id === "drawer-close") { state.drawer = false; draw(); return; }
  if (t.id === "open-filters") { state.drawer = true; if (state.cat === "all") state.cat = "movies"; draw(); return; }
  if (t.id === "apply-filters") { state.lib = "logs"; state.drawer = false; draw(); return; }
  if (t.id === "clear-filters") { state.filters = { status:"", sort:"dateDesc", genre:"", collection:"", players:[] }; draw(); return; }
  if (t.id === "open-recap") { state.sheet = "recap"; state.focus = "Your recap"; draw(); return; }
  if (t.id === "refresh-discover") {
    state.discoverStatus = "reading"; draw();
    clearTimeout(window._discoverTimer);
    window._discoverTimer = setTimeout(() => { state.discoverStatus = "saved"; state.discoverLocked = true; state.discoverAt = "just now"; draw(); }, 1400);
    return;
  }
  if (t.dataset.logMatch !== undefined) {
    const card = t.closest("[data-open-item]");
    if (card?.dataset.openItem) state.cat = card.dataset.openItem;
    const title = t.dataset.focus || card?.querySelector("h3")?.textContent || state.itemTitle;
    state.itemTitle = title;
    state.focus = title;
    const cat = state.cat === "all" ? "movies" : shownCat();
    const row = (DATA[cat]?.logs || []).find((r) => r.title === title);
    boardBundle(title, row);
    state.sheet = "match";
    draw();
    return;
  }
  if (t.dataset.log !== undefined) {
    const card = t.closest("[data-open-item]");
    if (card?.dataset.openItem) state.cat = card.dataset.openItem;
    state.focus = t.dataset.focus || card?.querySelector("h3")?.textContent || "Log";
    const cat = state.cat === "all" ? "movies" : shownCat();
    const row = (DATA[cat]?.logs || []).find((r) => r.title === state.focus);
    state.log = blankLog(cat, row);
    state.sheet = true; draw(); return;
  }
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
  if (t.dataset.see) { state.cat = t.dataset.see; state.lib = "logs"; state.screen = "dashboard"; state.filters.status = ""; draw(); return; }
  if (t.dataset.marketGo) { state.market = t.dataset.marketGo; go("market"); return; }
  if (t.dataset.cat) { state.cat = t.dataset.cat; state.filters = { ...state.filters, status:"", genre:"", collection:"", players:[] }; draw(); return; }
  if (t.dataset.layout) { state.layout = t.dataset.layout; draw(); return; }
  if (t.dataset.lib) { state.lib = t.dataset.lib; draw(); return; }
  if (t.dataset.pane) { state.pane = t.dataset.pane; draw(); return; }
  if (t.dataset.market) { state.market = t.dataset.market; draw(); return; }
  if (t.dataset.discover) { state.discoverCat = t.dataset.discover; draw(); return; }
  if (t.dataset.tab) { state.itemTab = t.dataset.tab; draw(); return; }
  if (t.dataset.pace) { state.paceMode = t.dataset.pace; draw(); return; }
  if (t.dataset.period) { state.pacePeriod = t.dataset.period; draw(); return; }
  if (t.dataset.spend) { state.spendPeriod = t.dataset.spend; draw(); return; }
  if (t.dataset.clear) { state.filters[t.dataset.clear] = ""; draw(); return; }
  if (t.dataset.own && state.log) { state.log.own = t.dataset.own; draw(); return; }
  if (t.dataset.rate !== undefined && state.log) { state.log.rating = Number(t.dataset.rate); draw(); return; }
  if (t.dataset.addMatch !== undefined && state.log) {
    const n = parseInt(state.log.matches || "0", 10);
    state.log.matches = String((Number.isFinite(n) ? n : 0) + 1);
    draw(); return;
  }
  if (t.dataset.addPlayer !== undefined) { state.boards[state.itemTitle].session.players.push({ name: "", score: "", winner: false, app: false }); draw(); return; }
  if (t.dataset.removePlayer !== undefined) { state.boards[state.itemTitle].session.players.splice(Number(t.dataset.removePlayer), 1); draw(); return; }
  if (t.dataset.winner !== undefined) { const p = state.boards[state.itemTitle].session.players[Number(t.dataset.winner)]; p.winner = !p.winner; draw(); return; }
  if (t.dataset.pickDate !== undefined) { state.boards[state.itemTitle].session.pickDate = true; draw(); return; }
  if (t.dataset.openMatch) { const m = state.boards[state.itemTitle].history.find((x) => x.id === t.dataset.openMatch); if (m) m.open = !m.open; draw(); return; }
  if (t.dataset.deleteMatch) { state.boards[state.itemTitle].confirm = t.dataset.deleteMatch; draw(); return; }
  if (t.dataset.cancelDelete !== undefined) { state.boards[state.itemTitle].confirm = ""; draw(); return; }
  if (t.dataset.confirmDelete) {
    const bundle = state.boards[state.itemTitle];
    bundle.history = bundle.history.filter((m) => m.id !== t.dataset.confirmDelete);
    bundle.count = Math.max(0, bundle.count - 1);
    bundle.confirm = "";
    if (state.log && state.focus === state.itemTitle) state.log.matches = String(bundle.count);
    toast("Match removed"); draw(); return;
  }
  if (t.dataset.saveMatch !== undefined) { saveMatch(false); return; }
  if (t.dataset.saveBanner !== undefined) { saveMatch(true); return; }
  if (t.dataset.player) { const n = t.dataset.player; state.filters.players = state.filters.players.includes(n) ? state.filters.players.filter((p) => p !== n) : [...state.filters.players, n]; draw(); return; }
  if (t.dataset.day) {
    const cat = state.cat === "all" ? "movies" : shownCat();
    state.focus = `March ${t.dataset.day}`;
    state.log = blankLog(cat);
    state.sheet = true; draw(); return;
  }
  if (t.dataset.switch !== undefined || t.classList.contains("switch")) { const btn = t.classList.contains("switch") ? t : t.closest(".switch"); btn.setAttribute("aria-pressed", btn.getAttribute("aria-pressed")==="true"?"false":"true"); return; }
  if (t.dataset.toast) toast(t.dataset.toast);
  if (t.id === "theme-btn") { state.theme = state.theme === "dark" ? "light" : "dark"; draw(); }
  if (t.id === "frame-btn") { state.frame = state.frame === "desktop" ? "phone" : "desktop"; draw(); }
  if (t.id === "save-log") toast("Nothing was saved.");
  if (t.id === "cookie-ok") { state.cookie = false; draw(); }
  if (t.id === "ob-light" || t.id === "set-light") { state.theme = "light"; draw(); }
  if (t.id === "ob-dark" || t.id === "set-dark") { state.theme = "dark"; draw(); }
  if (t.id === "ob-back") { state.step = Math.max(0, state.step - 1); draw(); }
  if (t.id === "ob-next") { if (state.step >= 4) go("dashboard"); else { state.step += 1; draw(); } }
  if (t.closest("[data-open-item]")) {
    const card = t.closest("[data-open-item]");
    if (card.dataset.openItem) state.cat = card.dataset.openItem;
    state.itemTitle = card.querySelector("h3")?.textContent || "";
    state.itemTab = "review";
    go("item");
  }
});
document.body.addEventListener("change", (e) => {
  const prevStatus = state.log?.status;
  syncDraft();
  const t = e.target;
  const cat = state.cat === "all" ? "movies" : shownCat();
  if (state.log && state.sheet === true && t.dataset.logField === "status") {
    applyStatusEffects(state.log.status, prevStatus, state.log, cat);
    draw(); return;
  }
  if (state.log && state.sheet === true && (t.dataset.logField === "season" || t.dataset.logField === "episode")) {
    if (t.dataset.logField === "season") clampEpisode(state.log);
    if ((cat === "tv" || cat === "anime") && COMPLETED.has(state.log.status)) state.log.status = "Watching";
    draw(); return;
  }
  if (t.hasAttribute("data-filter-cat")) { state.cat = t.value; state.filters = { ...state.filters, status:"", genre:"", collection:"", players:[] }; draw(); }
  if (t.dataset.filter) { state.filters[t.dataset.filter] = t.value; draw(); }
  if (t.dataset.hof) { state.hofPeriod = t.value; draw(); }
});
document.getElementById("jump").addEventListener("change", (e) => go(e.target.value));
document.getElementById("drawer").addEventListener("click", (e) => { if (e.target.id === "drawer") { state.drawer = false; draw(); } });
document.getElementById("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") { state.sheet = false; draw(); } });
draw();
</script>
</body>
</html>
