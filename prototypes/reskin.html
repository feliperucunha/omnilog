<!DOCTYPE html>
<html lang="en" data-theme="dark" data-frame="desktop" data-shell="app">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype — Reskin — Geeklogs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* PROTOTYPE, throwaway. Visual language v1 — Restructure reuses these tokens.
     Light: warm paper, ink, teal accent. Dark: olive black, same accent family.
     Display: Fraunces. UI: Outfit. Solid buttons, 12px cards, 2:3 covers. */
  :root {
    --bg: #f3efe7;
    --sunken: #e8e2d6;
    --surface: #fffcf8;
    --surface-2: #f6f1e8;
    --ink: #1c1915;
    --muted: #6b645b;
    --faint: #8a8176;
    --line: #e3dace;
    --accent: #0e6e6b;
    --accent-ink: #f3fffe;
    --star: #a8641a;
    --danger: #9d342c;
    --shadow: 0 1px 2px rgba(40, 32, 18, 0.05);
    --display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --font: "Outfit", system-ui, sans-serif;
    --sidebar: 232px;
    --radius: 14px;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #10120f;
    --sunken: #0c0e0b;
    --surface: #1a1d18;
    --surface-2: #23271f;
    --ink: #f4f0e8;
    --muted: #b3acA1;
    --faint: #8e877c;
    --line: #31362d;
    --accent: #7ee8df;
    --accent-ink: #06211f;
    --star: #f0b429;
    --danger: #ff9a92;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    background: var(--sunken);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p { margin: 0; }
  img { max-width: 100%; }

  .proto {
    position: sticky; top: 0; z-index: 50;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 12px;
    background: #1c1915; color: #f4f0e8;
    font-size: 12px;
  }
  .proto strong { font-weight: 650; letter-spacing: 0.02em; }
  .proto .sp { flex: 1; min-width: 8px; }
  .proto button, .proto select {
    background: #2a2622; color: #f4f0e8; border: 1px solid #4a433b;
    border-radius: 8px; padding: 6px 8px; min-height: 32px;
  }
  .proto .state { color: #c9c0b4; }

  .stage { min-height: calc(100vh - 48px); }
  .app { position: relative; min-height: calc(100vh - 48px); background: var(--bg); }
  [data-frame="desktop"][data-shell="app"] .app {
    display: grid;
    grid-template-columns: var(--sidebar) minmax(0, 1fr);
  }
  [data-frame="desktop"][data-shell="app"] .sidebar { grid-column: 1; grid-row: 1; }
  [data-frame="desktop"][data-shell="app"] .column { grid-column: 2; grid-row: 1; min-width: 0; }
  [data-frame="phone"] .stage {
    width: 390px;
    height: min(820px, calc(100vh - 64px));
    margin: 12px auto 24px;
    border: 8px solid #1c1915;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.28);
    background: var(--bg);
  }
  [data-frame="phone"] .app { position: relative; height: 100%; display: flex; flex-direction: column; min-height: 0; }
  [data-frame="phone"] .column { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  [data-frame="phone"] .content { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
  [data-frame="desktop"] .phone-head, [data-frame="desktop"] .dock { display: none; }
  [data-frame="phone"] .sidebar { display: none; }
  [data-shell="plain"] .sidebar, [data-shell="plain"] .dock, [data-shell="plain"] .phone-head { display: none !important; }
  [data-shell="plain"][data-frame="desktop"] .app { display: block; }
  [data-frame="phone"][data-shell="app"] .content { padding-bottom: 84px; }

  .sidebar {
    position: sticky; top: 48px; height: calc(100vh - 48px);
    background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 16px 12px; gap: 4px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 8px 14px; text-decoration: none; color: inherit;
  }
  .mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-family: var(--display); font-weight: 650;
  }
  .brand b { font-family: var(--display); font-size: 22px; font-weight: 650; letter-spacing: -0.03em; }
  .navbtn, .dock a, .textlink {
    background: none; border: 0; text-align: left; color: var(--ink); text-decoration: none;
  }
  .navbtn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px; min-height: 44px; color: var(--muted); font-weight: 550;
  }
  .navbtn[aria-current="page"], .dock a[aria-current="page"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--ink); }
  .navbtn svg, .dock svg { flex: none; }

  .phone-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 8px; background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .phone-head b { font-family: var(--display); font-size: 20px; }

  .content { padding: 22px 28px 48px; }
  [data-frame="phone"] .content { padding: 14px 14px 24px; }
  .view { display: none; }
  .view.on { display: block; }

  .page-title { font-family: var(--display); font-size: 34px; font-weight: 560; letter-spacing: -0.03em; line-height: 1.1; }
  [data-frame="phone"] .page-title { font-size: 28px; }
  .lede { color: var(--muted); max-width: 46rem; }
  .kicker { font-size: 12px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spread { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent;
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
  .btn.danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
  .chips { display: flex; gap: 6px; overflow: auto; padding-bottom: 2px; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    border-radius: 999px; padding: 8px 12px; min-height: 36px; font-weight: 550; font-size: 13px;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field span { font-size: 13px; font-weight: 600; }
  input[type="text"], input[type="email"], input[type="password"], input[type="number"], select, textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; min-height: 44px;
  }
  .row > select { width: auto; min-width: 9rem; flex: none; }
  .row > .btn { flex: none; }
  textarea { min-height: 96px; resize: vertical; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); font-size: 13px; }

  .cover {
    border-radius: 10px; display: grid; place-items: end start; padding: 8px;
    color: white; font-family: var(--display); font-weight: 650; letter-spacing: -0.03em;
    text-shadow: 0 1px 2px rgba(0,0,0,.35); background-size: cover;
  }
  .logs { display: flex; flex-direction: column; gap: 8px; }
  .logs.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
  .log {
    display: flex; gap: 12px; text-align: left; width: 100%;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px; box-shadow: var(--shadow); color: inherit;
  }
  .logs.list .cover { width: 64px; height: 96px; flex: none; font-size: 14px; }
  .logs.grid .log { flex-direction: column; }
  .logs.grid .cover { width: 100%; aspect-ratio: 2/3; height: auto; font-size: 22px; }
  .log-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .log-top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
  .log-top h3 { font-size: 16px; font-weight: 620; letter-spacing: -0.02em; }
  .pill {
    flex: none; font-size: 11px; font-weight: 650; letter-spacing: 0.02em;
    border-radius: 999px; padding: 3px 8px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
  }
  .stars { color: var(--star); letter-spacing: 1px; font-size: 13px; }
  .stars b { color: var(--ink); letter-spacing: 0; font-weight: 620; margin-left: 4px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; }
  .facts span, .meta-grid div {
    font-size: 12px; color: var(--muted); background: var(--surface-2);
    border-radius: 999px; padding: 3px 8px;
  }
  .snippet { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .hero {
    display: grid; grid-template-columns: 148px 1fr; gap: 18px; align-items: end;
  }
  [data-frame="phone"] .hero { grid-template-columns: 104px 1fr; gap: 12px; }
  .hero .cover { width: 100%; aspect-ratio: 2/3; font-size: 28px; border-radius: 12px; }
  .meta-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .meta-grid div { border-radius: 8px; }

  .dock {
    position: absolute; left: 10px; right: 10px; bottom: 10px;
    display: flex; justify-content: space-between; gap: 2px;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border: 1px solid var(--line); border-radius: 18px;
    padding: 6px; backdrop-filter: blur(10px);
  }
  [data-frame="desktop"] .dock { position: static; }
  .dock a {
    flex: 1; min-height: 48px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 10px; font-weight: 600; color: var(--muted);
  }
  .sheet-back {
    position: absolute; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; justify-content: center; z-index: 5;
  }
  .sheet-back.on { display: flex; }
  [data-frame="desktop"] .sheet-back { align-items: center; }
  .sheet {
    width: min(520px, 100%); background: var(--surface); color: var(--ink);
    border-radius: 18px 18px 0 0; padding: 12px 16px 20px; max-height: 86%; overflow: auto;
  }
  [data-frame="desktop"] .sheet { border-radius: 18px; max-height: 80%; }
  .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
  [data-frame="desktop"] .grab { display: none; }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  [data-frame="phone"] .stats { grid-template-columns: 1fr 1fr; }
  .stat b { display: block; font-family: var(--display); font-size: 28px; font-weight: 560; letter-spacing: -0.03em; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 88px; }
  .bars i { display: block; flex: 1; border-radius: 6px 6px 2px 2px; background: var(--accent); opacity: 0.85; }
  .split { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 12px; }
  [data-frame="phone"] .split, [data-frame="phone"] .plans, [data-frame="phone"] .auth-wrap { grid-template-columns: 1fr; }
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .switch {
    width: 44px; height: 26px; border-radius: 99px; border: 0; background: var(--line); position: relative; flex: none;
  }
  .switch i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: white; }
  .switch[aria-pressed="true"] { background: var(--accent); }
  .switch[aria-pressed="true"] i { left: 21px; }
  .set-row {
    display: flex; justify-content: space-between; gap: 12px; align-items: center;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal button {
    aspect-ratio: 1; border-radius: 8px; border: 1px solid transparent; background: var(--surface-2); color: var(--ink); font-size: 12px;
  }
  .cal button.has { box-shadow: inset 0 -3px 0 var(--accent); }
  .listing {
    display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center;
  }
  [data-frame="phone"] .listing { grid-template-columns: 64px 1fr; }
  [data-frame="phone"] .listing .price { grid-column: 2; }
  .price { font-family: var(--display); font-size: 22px; }
  .auth-wrap { max-width: 420px; margin: 8vh auto; display: flex; flex-direction: column; gap: 14px; }
  .landing { max-width: 1040px; margin: 0 auto; padding: 48px 28px 64px; display: flex; flex-direction: column; gap: 36px; }
  [data-frame="phone"] .landing { padding: 28px 16px 40px; }
  .media-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  [data-frame="phone"] .media-row { grid-template-columns: repeat(4, 1fr); }
  .media-row .cover { aspect-ratio: 2/3; font-size: 13px; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 999px;
    font-size: 13px; z-index: 70;
  }
  .cookie {
    display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details summary { cursor: pointer; font-weight: 600; }
  .prose { display: flex; flex-direction: column; gap: 10px; max-width: 42rem; }
  .prose p, .prose li { color: var(--muted); }
  .hof { display: flex; gap: 10px; }
  .hof .cover { width: 72px; height: 108px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
</style>
</head>
<body>
<div class="proto">
  <strong>PROTOTYPE · Reskin</strong>
  <span>Today’s screens, new presentation. Nothing is saved.</span>
  <span class="sp"></span>
  <label>Screen <select id="jump"></select></label>
  <button type="button" id="theme-btn">Theme</button>
  <button type="button" id="frame-btn">Frame</button>
  <span class="state" id="state-line"></span>
</div>
<div class="stage">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="column">
      <header class="phone-head"><b>Geeklogs</b><span class="faint" id="phone-screen"></span></header>
      <main class="content" id="main"></main>
    </div>
    <nav class="dock" id="dock"></nav>
    <div class="sheet-back" id="sheet">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="grab"></div>
        <div class="spread"><h2 id="sheet-title">Log</h2><button class="btn ghost small" type="button" id="sheet-close">Close</button></div>
        <div id="sheet-body" class="stack" style="margin-top:12px"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

function stars(n) {
  if (!n) return '<span class="faint">No rating</span>';
  const full = Math.round(n);
  return `<span class="stars" aria-label="${n} of 5">${"★".repeat(full)}${"☆".repeat(5 - full)}<b>${n}</b></span>`;
}
function cover(title, bg, cls) {
  const initials = title.split(/\s+/).slice(0, 2).map((w) => w[0]).join("");
  return `<div class="cover ${cls || ""}" style="background:${bg}">${initials}</div>`;
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.hidden = false;
  el.textContent = msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 1800);
}
function go(screen, extra) {
  if (extra) Object.assign(state, extra);
  if (screen === "login" || screen === "landing" || screen === "register" || screen === "forgot" || screen === "reset") state.authed = false;
  if (screen === "dashboard" || screen === "onboarding") state.authed = true;
  state.screen = screen;
  if (screen !== "statistics" && state.cat === "all") state.cat = "movies";
  state.sheet = false;
  draw();
}
function catChips(active) {
  return `<div class="chips" role="tablist">${CATS.map(([id, label]) =>
    `<button type="button" class="chip" role="tab" aria-pressed="${id === active}" data-cat="${id}">${label}</button>`
  ).join("")}</div>`;
}
function logCard(row, cat) {
  const [title, year, status, rating, blurb, facts, bg] = row;
  return `<button type="button" class="log" data-open-item="${cat || ""}">
    ${cover(title, bg)}
    <span class="log-body">
      <span class="log-top"><h3>${title}</h3><span class="pill">${status}</span></span>
      <span class="faint">${year}</span>
      ${stars(rating)}
      ${blurb ? `<span class="snippet">${blurb}</span>` : ""}
      <span class="facts">${facts.map((f) => `<span>${f}</span>`).join("")}</span>
    </span>
  </button>`;
}
function formFields(cat) {
  const statuses = STATUS[cat].map((s) => `<button type="button" class="chip" data-status="${s}" aria-pressed="${s === STATUS[cat][0]}">${s}</button>`).join("");
  const extras = FIELDS[cat].map((label) => `<label class="field"><span>${label}</span><input type="text" placeholder="${label}" /></label>`).join("");
  return `<div class="stack">
    <div class="field"><span>Status</span><div class="seg chips">${statuses}</div></div>
    ${extras}
    <div class="field"><span>Rating</span><div class="stars" style="font-size:20px">★★★★☆</div></div>
    <label class="field"><span>Review</span><textarea placeholder="What stayed with you?"></textarea></label>
    <button class="btn" type="button" id="save-log">Save log</button>
  </div>`;
}

    return `<div class="auth-wrap"><span class="kicker">Step ${state.step + 1} of ${steps.length}</span>${steps[state.step]}<div class="row"><button class="btn ghost" type="button" id="ob-back" ${state.step === 0 ? "disabled" : ""}>Back</button><button class="btn" type="button" id="ob-next">${state.step === steps.length - 1 ? "Finish" : "Continue"}</button></div></div>`;
  },
  dashboard: viewDashboard,
  statistics: viewStats,
  search: viewSearch,
  item: viewItem,
  market: viewMarket,
  listing() {
    return `<div class="stack">
      <button class="btn ghost small" type="button" data-go="market" style="align-self:flex-start">Back</button>
      <div class="hero">${cover("Wingspan", "linear-gradient(160deg,#3f7d6a,#16342c)")}<div class="stack"><span class="kicker">Board Games · São Paulo</span><h1 class="page-title">Wingspan</h1><p class="price">$48 <span class="pill">Like new</span></p><p class="muted">Listed by @mina · 3 days ago</p></div></div>
      <div class="card stack"><p>Complete copy, sleeved. Collection from the same city. Pickup or local meetup.</p><div class="row"><button class="btn" type="button" data-toast="WhatsApp link is not opened">WhatsApp</button><button class="btn ghost" type="button" data-toast="Mail is not opened">Email</button></div></div>
    </div>`;
  },
  mine() {
    return `<div class="stack"><div class="spread"><h1 class="page-title">My listings</h1><button class="btn small" type="button" data-toast="Create listing is the same form, not built out here">New listing</button></div>
      <article class="card listing">${cover("Azul", "linear-gradient(160deg,#2f6fbf,#14304f)")}<span><b>Azul</b><span class="faint" style="display:block">Board Games · Active</span></span><span class="price">$30</span></article>
      <article class="card listing">${cover("Saga", "linear-gradient(160deg,#ef6f4a,#3a1d2a)")}<span><b>Saga, vol. 1</b><span class="faint" style="display:block">Comics · Active</span></span><span class="price">$15</span></article>
    </div>`;
  },
  profile() {
    return `<div class="stack">
      <div class="spread"><div class="row"><span class="mark">M</span><div><h1 class="page-title" style="font-size:32px">@mina</h1><p class="faint">Public profile · 235 logs</p></div></div><button class="btn small" type="button" data-toast="Follow is not saved">Follow</button></div>
      <div class="stats"><div class="card stat"><span class="faint">Logs</span><b>235</b></div><div class="card stat"><span class="faint">Reviews</span><b>48</b></div><div class="card stat"><span class="faint">Mean</span><b>4.3</b></div><div class="card stat"><span class="faint">Following</span><b>12</b></div></div>
      <h2>Recent logs</h2>
      <div class="logs list">${DATA.movies.logs.slice(0, 2).map((row) => logCard(row, "movies")).join("")}</div>
      <div class="spread"><h2>Store</h2><button class="btn ghost small" type="button" data-go="store">Open store</button></div>
    </div>`;
  },
  store() {
    return `<div class="stack">
      <button class="btn ghost small" type="button" data-go="profile" style="align-self:flex-start">@mina</button>
      <h1 class="page-title">Store</h1>
      <p class="muted">Listings this person has on the market.</p>
      <button type="button" class="card listing" data-go="listing">${cover("Wingspan", "linear-gradient(160deg,#3f7d6a,#16342c)")}<span><b>Wingspan</b><span class="faint" style="display:block">Board Games · São Paulo</span></span><span class="price">$48</span></button>
      <button type="button" class="card listing" data-go="listing">${cover("Piranesi", "linear-gradient(160deg,#d7d3c4,#5c584c)")}<span><b>Piranesi</b><span class="faint" style="display:block">Books · Rio de Janeiro</span></span><span class="price">$12</span></button>
    </div>`;
  },
  settings() {
    const row = (title, desc, on) => `<div class="set-row"><div><b>${title}</b><div class="faint">${desc}</div></div><button type="button" class="switch" aria-pressed="${on ? "true" : "false"}" data-switch><i></i></button></div>`;
    return `<div class="stack"><h1 class="page-title">Settings</h1>
      <section class="card"><span class="kicker">Profile</span>${row("Show public profile", "Anyone with the link can view @mina", true)}${row("Show log count", "Visible on the public profile", true)}${row("Show reviews", "Reviews appear on the profile", true)}<div class="set-row"><button class="btn ghost small" type="button" data-toast="Profile editor stays on this screen in the app">Edit profile</button></div></section>
      <section class="card stack"><span class="kicker">Subscription</span><p>Pro · renews in 18 days</p><button class="btn ghost small" type="button" data-go="plans" style="align-self:flex-start">Plans</button></section>
      <section class="card stack"><span class="kicker">General</span>
        <label class="field"><span>Language</span><select><option>English</option><option>Português</option></select></label>
        <div class="row"><span>Theme</span><button class="chip" type="button" id="set-light" aria-pressed="${state.theme === "light"}">Light</button><button class="chip" type="button" id="set-dark" aria-pressed="${state.theme === "dark"}">Dark</button></div>
        ${row("Monthly recap email", "A recap of what you finished", true)}
        ${row("Completion celebration", "Show the dialog when you finish a title", true)}
      </section>
      <section class="card stack"><span class="kicker">Catalogs</span>
        <label class="field"><span>Board game catalog</span><select><option>BoardGameGeek</option><option>Ludopedia</option></select></label>
        <label class="field"><span>Anime and manga titles</span><select><option>English</option><option>Romaji</option><option>Native</option></select></label>
      </section>
      <section class="card stack"><span class="kicker">Data</span><button class="btn ghost small" type="button" data-toast="Export downloads a file in the app" style="align-self:flex-start">Export logs</button>
        <label class="field"><span>API keys</span><input type="text" placeholder="Stored on this account" /></label>
      </section>
      <button class="btn danger" type="button" data-toast="Delete account is not performed">Delete account</button>
    </div>`;
  },
  plans() {
    return `<div class="stack"><h1 class="page-title">Plans</h1><div class="plans">
      <article class="card stack"><span class="kicker">Free</span><p class="page-title" style="font-size:32px">$0</p><ul class="muted"><li>Log every category</li><li>Ratings, progress, reviews</li><li>Limited catalog searches</li></ul></article>
      <article class="card stack" style="outline:2px solid var(--accent)"><span class="kicker">Pro</span><p class="page-title" style="font-size:32px">Pro</p><ul class="muted"><li>Unlimited search</li><li>Recaps and export</li><li>Market listings</li></ul><button class="btn" type="button" data-toast="Checkout is not started">Upgrade</button></article>
    </div></div>`;
  },
  about() {
    return `<div class="prose"><h1 class="page-title">About</h1><p>Geeklogs is one log for movies, TV, board games, games, books, anime, manga, and comics. Ratings, progress, sessions, and spending stay on the same account.</p><p>The phone app is this site inside the Capacitor shell.</p><button class="btn ghost" type="button" data-go="faq" style="align-self:flex-start">FAQ</button></div>`;
  },
  faq() {
    return `<div class="prose"><h1 class="page-title">FAQ</h1>${[
      ["What can I log?", "Movies, TV, board games, video games, books, anime, manga, and comics. Each category keeps its own status and progress fields."],
      ["Is the Android app separate?", "It is the same product, installed through the Capacitor shell."],
      ["Who can see my logs?", "You choose that in Settings. The public profile can hide the log count and reviews."],
      ["What does the market sell?", "Board games, books, manga, and comics, listed by people on Geeklogs."],
    ].map(([q, a]) => `<details open><summary>${q}</summary><p>${a}</p></details>`).join("")}</div>`;
  },
  privacy() {
    return `<div class="prose"><h1 class="page-title">Privacy</h1><p>Sample copy for the prototype, in the same place as the live policy. It is not the legal text.</p><p>The account stores your logs, ratings, reviews, preferences, and, if you list something, the contact details you choose to show buyers.</p><p><button class="textlink" type="button" data-go="terms" style="color:var(--accent);background:none;border:0;padding:0">Terms</button></p></div>`;
  },
  terms() {
    return `<div class="prose"><h1 class="page-title">Terms</h1><p>Sample copy for the prototype, in the same place as the live terms. It is not the legal text.</p><p>You keep what you write. Catalog data comes from the sources already wired into search. Market listings are between the people who post them.</p></div>`;
  },
};

function draw() {
  const plain = ["landing", "login", "register", "forgot", "reset", "onboarding"].includes(state.screen);
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.dataset.frame = state.frame;
  document.documentElement.dataset.shell = plain ? "plain" : "app";
  const nav = state.authed ? APP_NAV : GUEST_NAV;
  const dock = state.authed ? DOCK : GUEST_DOCK;
  document.getElementById("sidebar").innerHTML = shellNav(nav);
  document.getElementById("dock").innerHTML = dockNav(dock);
  document.getElementById("main").innerHTML = VIEWS[state.screen]();
  document.getElementById("phone-screen").textContent = SCREENS.find((s) => s[0] === state.screen)[1];
  document.getElementById("jump").value = state.screen;
  document.getElementById("theme-btn").textContent = state.theme === "dark" ? "Dark" : "Light";
  document.getElementById("frame-btn").textContent = state.frame === "desktop" ? "Desktop" : "Phone";
  const catLabel = state.cat === "all" ? "All" : (CATS.find((c) => c[0] === state.cat) || ["", ""])[1];
  document.getElementById("state-line").textContent = `${SCREENS.find((s) => s[0] === state.screen)[1]} · ${catLabel} · ${state.theme} · ${state.frame} · ${state.layout}`;
  const sheet = document.getElementById("sheet");
  sheet.classList.toggle("on", state.sheet);
  if (state.sheet) document.getElementById("sheet-body").innerHTML = formFields(state.cat === "all" ? "movies" : state.cat);
}

document.getElementById("jump").innerHTML = SCREENS.map(([id, label]) => `<option value="${id}">${label}</option>`).join("");

document.body.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-cat],[data-layout],[data-market],[data-status],[data-switch],[data-day],[data-open-item],[data-toast],#theme-btn,#frame-btn,#sheet-close,#save-log,#ob-next,#ob-back,#ob-light,#ob-dark,#set-light,#set-dark,#cookie-ok");
  if (!t) return;
  if (t.closest(".sheet-back") && e.target.id === "sheet") { state.sheet = false; draw(); return; }
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
  if (t.dataset.cat) {
    state.cat = t.dataset.cat;
    if (state.screen !== "statistics" && state.screen !== "dashboard" && state.screen !== "search" && state.screen !== "item") state.screen = "dashboard";
    draw();
    return;
  }
  if (t.dataset.layout) { state.layout = t.dataset.layout; draw(); return; }
  if (t.dataset.market) { state.market = t.dataset.market; draw(); return; }
  if (t.dataset.status) {
    t.parentElement.querySelectorAll("[data-status]").forEach((b) => b.setAttribute("aria-pressed", b === t ? "true" : "false"));
    toast(`Status · ${t.dataset.status}`);
    return;
  }
  if (t.dataset.switch !== undefined || t.classList.contains("switch")) {
    const btn = t.classList.contains("switch") ? t : t.closest(".switch");
    btn.setAttribute("aria-pressed", btn.getAttribute("aria-pressed") === "true" ? "false" : "true");
    return;
  }
  if (t.dataset.day) { state.sheet = true; draw(); return; }
  if (t.dataset.toast) toast(t.dataset.toast);
  if (t.id === "theme-btn") { state.theme = state.theme === "dark" ? "light" : "dark"; draw(); }
  if (t.id === "frame-btn") { state.frame = state.frame === "desktop" ? "phone" : "desktop"; draw(); }
  if (t.id === "sheet-close") { state.sheet = false; draw(); }
  if (t.id === "save-log") toast("Log stays on this screen in the app. Nothing was saved.");
  if (t.id === "cookie-ok") { state.cookie = false; draw(); }
  if (t.id === "ob-light" || t.id === "set-light") { state.theme = "light"; draw(); }
  if (t.id === "ob-dark" || t.id === "set-dark") { state.theme = "dark"; draw(); }
  if (t.id === "ob-back") { state.step = Math.max(0, state.step - 1); draw(); }
  if (t.id === "ob-next") {
    if (state.step >= 4) go("dashboard");
    else { state.step += 1; draw(); }
  }
  if (t.hasAttribute("data-open-item")) {
    if (t.dataset.openItem) state.cat = t.dataset.openItem;
    go("item");
  }
});

document.getElementById("jump").addEventListener("change", (e) => go(e.target.value));
document.getElementById("sheet").addEventListener("click", (e) => {
  if (e.target.id === "sheet") { state.sheet = false; draw(); }
});

draw();
</script>
</body>
