<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Initial value; ThemeContext syncs to match light/dark (see themeChromeSync.ts). -->
    <meta name="theme-color" content="#0b1220" />
    <title>Geeklogs — Track everything you watch, play, and read.</title>
    <meta name="description" content="Log movies, TV, games, board games, books, anime, manga, and comics in one place. Ratings, progress, stats, and more." />
    <!-- Favicon -->
    <link rel="icon" href="/logo-dark.png" type="image/png" />
    <link rel="icon" href="/logo.png" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="canonical" href="https://geeklogs.com.br/" />
    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Geeklogs" />
    <meta property="og:url" content="https://geeklogs.com.br/" />
    <meta property="og:title" content="Geeklogs — Track everything you watch, play, and read." />
    <meta property="og:description" content="Log movies, TV, games, board games, books, anime, manga, and comics in one place. Ratings, progress, stats, and more." />
    <meta property="og:image" content="https://geeklogs.com.br/logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:locale" content="en" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Geeklogs — Track everything you watch, play, and read." />
    <meta name="twitter:description" content="Log movies, TV, games, board games, books, anime, manga, and comics in one place. Ratings, progress, stats, and more." />
    <meta name="twitter:image" content="https://geeklogs.com.br/logo.png" />
    <script>
      (function() {
        var t = localStorage.getItem('geeklogs-theme');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var link = document.querySelector('link[rel="icon"]');
        if (link) link.href = t === 'dark' ? '/logo-dark.png' : '/logo.png';
        /* Keep in sync with src/lib/themeChromeSync.ts */
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', t === 'dark' ? '#0b1220' : '#F1F5F9');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
