<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Item page prototype</title>
<!--
  Throwaway prototype. Not production.
  Question: for the item page, does a visual reskin or a restructured layout
  better match the rest of Geeklogs while keeping current behavior?
  Two variants via ?variant=reskin|restructure. Scenarios via ?scenario=.
  One HTML file, as agreed: local state only, no app route.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-body: "Outfit", ui-sans-serif, system-ui, sans-serif;
    --font-display: "Fraunces", Georgia, serif;
    --color-darkest: #10120f;
    --color-dark: #1a1d18;
    --color-mid: #3d4336;
    --color-light: #b3aca1;
    --color-lightest: #f4f0e8;
    --color-surface-border: #31362d;
    --accent: #7ee8df;
    --accent-ink: #06211f;
    --danger: #f87171;
    --ok: #6ee7b7;
    --warn: #fcd34d;
  }
  html[data-theme="light"] {
    --color-darkest: #f3efe7;
    --color-dark: #fffcf8;
    --color-mid: #c9bfb0;
    --color-light: #6b645b;
    --color-lightest: #1c1915;
    --color-surface-border: #e3dace;
    --accent: #0e6e6b;
    --accent-ink: #f3fffe;
    --danger: #b91c1c;
    --ok: #047857;
    --warn: #b45309;
    color-scheme: light;
  }
  html[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--color-darkest);
    color: var(--color-lightest);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button svg { width: 18px; height: 18px; display: block; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }
  a { color: var(--accent); }

  .sidebar {
    display: none;
    position: fixed;
    inset: 0 auto 0 0;
    width: 6.5rem;
    flex-direction: column;
    gap: 4px;
    padding: 12px 8px;
    background: var(--color-dark);
    border-right: 1px solid var(--color-surface-border);
    z-index: 40;
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 4px 0 10px;
    background: none;
    border: 0;
    color: inherit;
  }
  .mark {
    width: 32px; height: 32px; border-radius: 9px;
    display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--font-display); font-weight: 640;
  }
  .brand b { font-family: var(--font-display); font-size: 13px; font-weight: 640; }
  .side-link, .dock button {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    border: 0; background: transparent; color: var(--color-light);
    border-radius: 12px; padding: 8px 4px; font-size: 10px; font-weight: 500;
  }
  .side-link svg, .dock svg { width: 22px; height: 22px; }

  .frame { min-height: 100%; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 8px;
    min-height: 64px; padding: 8px 14px;
    background: var(--color-darkest);
    border-bottom: 1px solid var(--color-surface-border);
  }
  .lockup { min-width: 0; flex: 1; }
  .lockup .word { font-family: var(--font-display); font-size: 16px; line-height: 1.2; }
  .lockup .sub { font-size: 12px; color: var(--color-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn, .avatar {
    width: 40px; height: 40px; border-radius: 999px; border: 0;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .icon-btn { background: var(--color-lightest); color: var(--color-darkest); }
  .avatar { background: color-mix(in srgb, var(--color-mid) 45%, transparent); border: 1px solid var(--color-light); font-weight: 600; }
  .search-desktop { display: none; }
  .menu {
    position: absolute; right: 14px; top: 60px; width: 220px;
    background: var(--color-dark); border: 1px solid var(--color-surface-border);
    border-radius: 14px; padding: 10px; z-index: 50;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .menu p { margin: 0 0 8px; font-size: 12px; color: var(--color-light); }
  .menu .row { display: flex; gap: 6px; }
  .menu button, .ghost, .solid, .soft {
    border-radius: 10px; min-height: 36px; padding: 0 12px;
  }
  .ghost { background: transparent; border: 1px solid color-mix(in srgb, var(--color-mid) 55%, transparent); }
  .solid { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 600; }
  .soft { background: color-mix(in srgb, var(--color-mid) 28%, transparent); border: 1px solid color-mix(in srgb, var(--color-mid) 40%, transparent); }
  .menu .on { outline: 2px solid var(--accent); }

  .scroll { flex: 1; overflow: auto; padding: 16px 14px 12.5rem; }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .panel {
    background: var(--color-dark);
    border: 1px solid color-mix(in srgb, var(--color-mid) 28%, transparent);
    border-radius: 12px;
    padding: 14px;
  }
  .eyebrow {
    margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--color-light); font-weight: 600;
  }
  h1, .display {
    font-family: var(--font-display); font-weight: 560; letter-spacing: -0.03em;
    line-height: 1.1; margin: 0;
  }
  h1 { font-size: 28px; }
  .muted { color: var(--color-light); }
  .hero-row { display: flex; gap: 12px; }
  .poster {
    width: 7rem; aspect-ratio: 2/3; border-radius: 12px; flex-shrink: 0;
    display: grid; place-items: end start; padding: 8px;
    background:
      linear-gradient(160deg, color-mix(in srgb, white 28%, transparent), transparent 55%),
      linear-gradient(hsl(var(--hue-n), 42%, 36%), hsl(var(--hue-n), 32%, 18%));
    color: white; font-family: var(--font-display); font-size: 13px;
  }
  .poster span { text-shadow: 0 1px 8px rgba(0,0,0,.45); }
  .meta { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
  .yearline { font-size: 14px; color: var(--color-light); }
  .stars { color: var(--accent); letter-spacing: 1px; font-size: 14px; }
  .stars button { background: none; border: 0; padding: 0 1px; color: color-mix(in srgb, var(--color-mid) 80%, var(--color-light)); font-size: 20px; }
  .stars button.on { color: var(--accent); }
  .pill, .badge {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 600;
    background: color-mix(in srgb, var(--color-mid) 30%, transparent);
    border: 1px solid color-mix(in srgb, var(--color-mid) 45%, transparent);
  }
  .badge-row, .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .soft-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .soft-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .soft-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); background: color-mix(in srgb, var(--danger) 14%, transparent); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin: 12px 0 0; }
  .facts div { min-width: 0; }
  .facts dt { font-size: 11px; color: var(--color-light); margin: 0; }
  .facts dd { margin: 2px 0 0; font-size: 14px; }
  .desc { font-size: 14px; line-height: 1.45; margin: 8px 0 0; }
  .desc.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
  .field span, label.lbl { font-size: 12px; color: var(--color-light); font-weight: 600; }
  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    width: 100%; min-height: 40px; border-radius: 10px; padding: 8px 10px;
    background: var(--color-darkest); border: 1px solid color-mix(in srgb, var(--color-mid) 45%, transparent);
  }
  textarea { min-height: 88px; resize: vertical; }
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--color-mid) 35%, transparent); }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; min-height: 34px; color: var(--color-light); }
  .seg button.on { background: color-mix(in srgb, var(--accent) 22%, var(--color-dark)); color: var(--color-lightest); font-weight: 600; }
  .own { display: flex; gap: 6px; }
  .own button { flex: 1; }
  .own button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions .solid, .actions .ghost { flex: 1; }
  .review {
    padding: 12px; border-radius: 12px; background: var(--color-dark); margin-top: 10px;
  }
  .reskin .review { border: 1px solid var(--color-mid); }
  .reskin .review.st-completed { border-color: #059669; }
  .reskin .review.st-progress { border-color: #fbbf24; }
  .reskin .review.st-dropped { border-color: #ef4444; }
  .reskin .review.st-plan { border-color: var(--color-mid); }
  .restructure .review {
    border: 1px solid color-mix(in srgb, var(--color-mid) 28%, transparent);
    border-left-width: 3px;
  }
  .restructure .review.st-completed { border-left-color: #059669; }
  .restructure .review.st-progress { border-left-color: #fbbf24; }
  .restructure .review.st-dropped { border-left-color: #ef4444; }
  .restructure .review.st-plan { border-left-color: var(--color-mid); }
  .who { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .who b { font-weight: 600; }
  .pro { color: var(--accent); }
  .admin { color: #fbbf24; }
  .reacts { display: flex; gap: 8px; margin-top: 8px; }
  .reacts button { min-height: 32px; }
  .reacts button.on { border-color: var(--accent); color: var(--accent); }
  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .level-pop {
    margin-top: 6px; font-size: 12px; padding: 6px 8px; border-radius: 8px;
    background: var(--color-darkest); border: 1px solid var(--color-surface-border);
  }
  .mast {
    position: relative; border-radius: 16px; overflow: hidden; min-height: 210px;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 14px;
    background:
      linear-gradient(180deg, transparent 20%, rgba(0,0,0,.72)),
      linear-gradient(hsl(var(--hue-n), 38%, 32%), hsl(var(--hue-n), 22%, 12%));
    color: white;
  }
  .mast h1, .mast .yearline, .mast .eyebrow { color: white; }
  .mast .yearline { color: rgba(255,255,255,.8); }
  .mast .back {
    position: absolute; top: 12px; left: 12px;
    background: rgba(0,0,0,.4); color: white; border: 0;
  }
  .peers {
    position: sticky; top: 0; z-index: 6;
    display: flex; gap: 6px; padding: 8px 0 10px;
    background: var(--color-darkest);
  }
  .peers button {
    flex: 1; border-radius: 999px; min-height: 36px; border: 1px solid color-mix(in srgb, var(--color-mid) 40%, transparent);
    background: transparent; color: var(--color-light);
  }
  .peers button.on { background: var(--color-lightest); color: var(--color-darkest); border-color: transparent; font-weight: 600; }
  .group-label { margin: 16px 0 0; font-size: 13px; font-weight: 650; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .savebar {
    position: sticky;
    bottom: 7.5rem;
    margin-top: 14px;
    padding-top: 8px;
    background: linear-gradient(transparent, var(--color-darkest) 30%);
  }
  .sheet, .modal-back {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0,0,0,.55);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet .card, .modal-back .card {
    width: min(420px, 100%);
    background: var(--color-dark);
    border-radius: 16px 16px 0 0;
    padding: 16px; max-height: 86vh; overflow: auto;
    border: 1px solid var(--color-surface-border);
  }
  .player { display: grid; grid-template-columns: 1fr 72px auto auto; gap: 6px; align-items: center; margin-top: 8px; }
  .trend { width: 100%; height: 36px; }
  .skel { border-radius: 12px; background: color-mix(in srgb, var(--color-mid) 35%, transparent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 9.5rem; z-index: 70;
    background: var(--color-lightest); color: var(--color-darkest);
    border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .banner {
    margin-top: 10px; padding: 8px 10px; border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
    font-size: 13px; font-weight: 600;
  }
  .dock {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(10px + env(safe-area-inset-bottom));
    width: min(390px, calc(100% - 20px));
    display: flex; justify-content: space-around;
    padding: 6px; z-index: 35;
    background: color-mix(in srgb, var(--color-dark) 92%, transparent);
    border: 1px solid var(--color-surface-border);
    border-radius: 18px;
    backdrop-filter: blur(16px);
  }
  .proto {
    position: fixed; z-index: 80; left: 50%; transform: translateX(-50%);
    bottom: calc(4.7rem + env(safe-area-inset-bottom));
    width: min(420px, calc(100% - 12px));
    background: #111; color: #f6f3ea;
    border-radius: 16px; padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    border: 1px solid #fff;
  }
  .proto-row { display: flex; align-items: center; gap: 6px; }
  .proto button.nav {
    width: 32px; height: 32px; border-radius: 999px; border: 0; background: #f6f3ea; color: #111; font-weight: 700;
  }
  .proto .label { flex: 1; text-align: center; font-size: 13px; font-weight: 650; }
  .proto .label small { display: block; font-weight: 500; color: #c8c2b4; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .proto select, .proto .mini {
    background: #2a2a2a; color: #f6f3ea; border: 1px solid #555; border-radius: 8px; min-height: 32px; font-size: 12px;
  }
  .proto select { flex: 1; }
  .proto .mini { padding: 0 8px; }
  .proto .mini.on { background: #f6f3ea; color: #111; }
  .proto details { margin-top: 6px; font-size: 11px; color: #c8c2b4; }
  .proto pre { margin: 6px 0 0; white-space: pre-wrap; max-height: 24vh; overflow: auto; }

  @media (min-width: 768px) {
    body:not(.phone) .sidebar { display: flex; }
    body:not(.phone) .frame { margin-left: 6.5rem; }
    body:not(.phone) .dock { display: none; }
    body:not(.phone) .scroll { padding: 18px 28px 7rem; }
    body:not(.phone) .search-desktop {
      display: flex; flex: 1; align-items: center; gap: 8px; min-height: 44px;
      border-radius: 10px; border: 1px solid var(--color-surface-border);
      background: var(--color-dark); color: var(--color-light); padding: 0 12px;
    }
    body:not(.phone) .search-mobile { display: none; }
    body:not(.phone) .lockup { display: none; }
    body:not(.phone) .proto { bottom: 16px; }
    body:not(.phone) .toast { bottom: 5.5rem; }
    body:not(.phone) .savebar { bottom: 5rem; }
    body:not(.phone) .facts { grid-template-columns: 1fr 1fr 1fr; }
  }
  body.phone { background: #090a08; }
  body.phone .frame {
    max-width: 390px; margin: 0 auto;
    border-left: 1px solid var(--color-surface-border);
    border-right: 1px solid var(--color-surface-border);
    min-height: 100%;
  }
  body.phone .sidebar { display: none !important; }
  body.phone .dock { display: flex !important; }
</style>
</head>
<body class="phone">
<aside class="sidebar" id="sidebar"></aside>
<div class="frame">
  <header class="topbar" id="topbar"></header>
  <div class="scroll" id="scroll"><div id="page"></div></div>
</div>
<nav class="dock" id="dock" aria-label="Main"></nav>
<div class="proto" id="proto">
  <div class="proto-row">
    <button class="nav" type="button" data-act="cycle" data-dir="-1" aria-label="Previous variant">←</button>
    <div class="label" id="variant-label"><small>Prototype</small><span></span></div>
    <button class="nav" type="button" data-act="cycle" data-dir="1" aria-label="Next variant">→</button>
  </div>
  <div class="proto-row" style="margin-top:6px">
    <select id="scenario" data-act="scenario" aria-label="Scenario"></select>
    <button type="button" class="mini on" id="phone-toggle" data-act="phone">Phone</button>
  </div>
  <details>
    <summary>State · pull down at the top to refresh reviews</summary>
    <pre id="state-readout"></pre>
  </details>
</div>
<div class="toast" id="toast" role="status"></div>

let section = ["log", "details", "reviews"].includes(params.get("section")) ? params.get("section") : "log";
let phone = params.get("width") !== "full";
let session = null;
let booted = false;

const scenarioSelect = document.getElementById("scenario");

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}
function today() {
  return new Date().toISOString().slice(0, 10);
}
function mediaType() {
  if (scenario === "signedout" || scenario === "loading" || scenario === "error") return "movies";
  return scenario;
}
function authed() {
  return scenario !== "signedout";
}
function currentItem() {
  return ITEMS[mediaType()];
}
function statusKind(status) {
  if (status === "dropped") return "dropped";
  if (IN_PROGRESS.has(status)) return "progress";
  if (COMPLETED.has(status)) return "completed";
  return "plan";
}
function starsText(grade) {
  const n = Math.max(0, Math.min(5, Math.round((grade || 0) / 2)));
  return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
}
function contentHours(itemData) {
  const mins = itemData.runtimeMinutes;
  if (!mins) return "";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h ? `${h}h ${m}m` : `${m}m`;
}

function buildReviews(media) {
  if (media === "comics") return [];
  const statuses = STATUSES[media];
  const count = media === "tv" || media === "anime" ? 8 : 12;
  const reviews = [];
  for (let i = 0; i < count; i++) {
    const person = USERS[i % USERS.length];
    const review = {
      id: `${media}-${i}`,
      ...person,
      grade: [6, 8, 9, 7, 10, 4, 8, 5, 9, 6, 7, 8][i],
      date: new Date(2026, 0, 28 - i).toISOString().slice(0, 10),
      status: statuses[i % statuses.length],
      text: LINES[i % LINES.length],
      likes: (i * 3) % 11,
      dislikes: i % 3,
    };
    if (media === "tv" || media === "anime") {
      if (i % 3 === 0) review.scope = "show";
      else if (i % 3 === 1 && media === "tv") {
        review.scope = "season";
        review.season = 1 + (i % 2);
      } else {
        review.scope = "episode";
        review.season = media === "anime" ? 1 : 2;
        review.episode = 1 + (i % 5);
      }
    }
    if (media === "manga") {
      review.chapter = 12 + i;
      review.volume = 1 + (i % 3);
    }
    reviews.push(review);
  }
  return reviews;
}

function blankSession(media) {
  const fromUrl = !booted;
  let tab = "review";
  if (fromUrl && params.get("matches") === "1" && media === "boardgames") tab = "matches";
  if (fromUrl && params.get("market") === "1" && MARKET.has(media)) tab = "market";
  return {
    reviews: buildReviews(media),
    descriptionOpen: false,
    log: null,
    reviewsLoading: false,
    sort: "recent",
    page: 1,
    reactions: {},
    expanded: {},
    tab,
    partials: media === "tv"
      ? [{ id: "p1", scope: "season", season: 1, episode: null, grade: 8, text: "Season one is the tight one.", status: "completed" }]
      : media === "anime"
        ? [{ id: "p1", scope: "episode", season: 1, episode: 4, grade: 10, text: "Episode four is the one I keep quoting.", status: "watching" }]
        : [],
    matches: media === "boardgames" ? [
      { id: "m1", date: "2026-02-02", duration: 75, notes: "First play. Sam ran the grasslands.", players: [
        { name: "You", score: 78, winner: false, app: true },

      ]},

        { name: "You", score: 91, winner: true, app: true },
        { name: "Sam", score: 70, winner: false, app: true },
      ]},
    ] : [],
    matchOpen: false,
    matchDraft: null,
    expandedMatch: {},
    confirmDelete: null,
    listing: MARKET.has(media) ? { price: "48", condition: "Good", notes: "Sleeved. Played twice.", published: true } : null,

    dateStart: "",
    dateEnd: "",

    hours: "",

    price: "",

    matchesPlayed: media === "boardgames" ? "2" : "",

function snapshot() {
  const keys = ["status", "grade", "reviewText", "season", "episode", "chapter", "volume", "pagesRead", "dateStart", "dateEnd", "platform", "hours", "ownership", "price", "salePrice", "matchesPlayed"];
  const data = {};
  keys.forEach((key) => { data[key] = session[key]; });
  return JSON.stringify(data);
}

function loadScenario(name) {
  scenario = name;
  session = blankSession(mediaType());
  booted = true;
  writeUrl();
  render();
}

function writeUrl() {
  const next = new URLSearchParams();
  next.set("variant", variant);
  next.set("scenario", scenario);
  if (variant === "restructure") next.set("section", section);
  if (!phone) next.set("width", "full");
  const media = mediaType();
  if (authed() && session && session.tab === "matches" && media === "boardgames") next.set("matches", "1");
  if (authed() && session && session.tab === "market" && MARKET.has(media)) next.set("market", "1");
  history.replaceState(null, "", `${location.pathname}?${next}`);
}

function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 2200);
}

function refresh() {
  if (scenario === "loading" || scenario === "error") return;
  session.reviewsLoading = true;
  render();
  setTimeout(() => {
    session.reviewsLoading = false;
    render();
    toast("Reviews refreshed");
  }, 700);
}

function applyStatus(next) {
  session.status = next;
  const data = currentItem();
  const media = mediaType();
  if (COMPLETED.has(next)) {
    if (!session.dateEnd) session.dateEnd = today();
    if ((media === "tv" || media === "anime") && data.episodes) session.episode = String(data.episodes);
    if ((media === "books" || media === "manga" || media === "comics") && data.pages) session.pagesRead = String(data.pages);
  }
  render();
}

function upsertOwnReview() {
  const data = currentItem();
  const own = {
    id: "you",
    user: "you",
    level: 7,
    grade: Number(session.grade) || 0,
    date: today(),
    status: session.status,
    text: session.reviewText || "Logged without a write-up.",
    likes: 0,
    dislikes: 0,
    chapter: session.chapter ? Number(session.chapter) : undefined,
    volume: session.volume ? Number(session.volume) : undefined,
    scope: "show",
  };
  session.reviews = [own, ...session.reviews.filter((review) => review.id !== "you")];
  if (data.count === 0) data.count = 1;
}

function saveLog() {
  if (!session.status) {
    toast("Pick a status first");
    return;
  }
  const next = snapshot();
  if (session.log === next) {
    toast("Nothing to update");
    return;
  }
  const creating = !session.log;
  session.log = next;
  upsertOwnReview();
  const data = currentItem();
  const hours = COMPLETED.has(session.status) ? contentHours(data) : "";
  const verb = creating ? "Review saved" : "Review updated";
  toast(hours ? `${verb} · ${hours} of content` : verb);
  if (COMPLETED.has(session.status) && !session.hideComplete) session.completeOpen = true;
  render();
}

function savePartial(scope) {
  const media = mediaType();
  if (media === "anime") scope = "episode";
  if (scope === "season" && !session.season) {
    toast("Pick a season");
    return;
  }
  if (scope === "episode" && !session.episode) {
    toast("Pick an episode");
    return;
  }
  session.partials.unshift({
    id: "p" + Date.now(),
    scope,
    season: Number(session.season) || 1,
    episode: scope === "episode" ? Number(session.episode) : null,
    grade: Number(session.grade) || 0,
    text: session.reviewText,
    status: session.status || "watching",
  });
  toast(scope === "season" ? "Season review saved" : "Episode review saved");
  render();
}

function openMatch() {
  if (!session.log) {
    session.status = session.status || "played";
    session.log = snapshot();
    toast("Log created so this match can be saved");
  }
  session.matchDraft = {
    date: today(), duration: "60", notes: "",
    players: [{ name: "You", score: "", winner: true, app: true }],
  };
  session.matchOpen = true;
  render();
}

function saveMatch(celebrate) {
  const draft = session.matchDraft;
  session.matches.unshift({
    id: "m" + Date.now(),
    date: draft.date,
    duration: Number(draft.duration) || 0,
    notes: draft.notes,
    players: draft.players.map((player) => ({ ...player, score: Number(player.score) || 0 })),
  });
  session.matchesPlayed = String(session.matches.length);
  session.matchOpen = false;
  session.celebrate = celebrate;
  toast(celebrate ? "Match saved" : "Match saved");
  render();
  if (celebrate) setTimeout(() => { session.celebrate = false; render(); }, 2500);
}

    : `<button type="button" class="ghost" data-act="partial" data-value="episode">Save episode</button>`;
  const list = session.partials.map((partial) => {
    const where = partial.scope === "episode" ? `S${partial.season}·E${partial.episode}` : `Season ${partial.season}`;
    return `<div class="review st-${statusKind(partial.status)}" style="margin-top:8px">
      <div class="who"><b>${where}</b><span class="stars">${starsText(partial.grade)}</span></div>
      <p style="margin:6px 0 0">${esc(partial.text || "No write-up")}</p>
      <button type="button" class="linkish" data-act="delete-partial" data-value="${partial.id}">Delete</button>
    </div>`;
  }).join("");
  return `<p class="group-label">Scoped reviews</p><div class="actions">${buttons}</div>${list}`;
}

function textField() {
  return `<label class="field"><span>Review</span><textarea data-field="reviewText">${esc(session.reviewText)}</textarea></label>`;
}

function affinityNote() {
  if (session.log) return "";
  const data = currentItem();
  if (!data.affinity && !data.source) return "";
  const bits = [];
  if (data.affinity) bits.push(`affinity ${data.affinity}`);
  if (data.source) bits.push(`source ${data.source}`);
  return `<p class="muted" style="font-size:12px">A new log keeps the item's ${esc(bits.join(" and "))}.</p>`;
}

function chips() {
  if (!session.log) return "";
  const bits = [];
  if (session.ownership) bits.push(session.ownership);
  if (session.matchesPlayed) bits.push(`${session.matchesPlayed} matches`);
  if (!bits.length) return "";
  return `<div class="chip-row" style="margin-bottom:8px">${bits.map((bit) => `<span class="pill">${esc(bit)}</span>`).join("")}</div>`;
}

function formReskin() {
  return `${chips()}<h2 class="display" style="font-size:22px;margin:0 0 4px">${session.log ? "Your review" : "Add review"}</h2>
    ${statusSelect()}${progressFields()}${collectionFields()}${partialsHtml()}
    <div class="field"><span>Rating</span>${starPicker()}</div>
    ${textField()}${affinityNote()}
    <div class="actions"><button type="button" class="solid" data-act="save">${session.log ? "Update" : "Save"}</button></div>`;
}

function formRestructure() {
  return `${chips()}
    <div class="pair" style="align-items:end">
      <div>${statusSelect()}</div>
      <div class="field"><span>Rating</span>${starPicker()}</div>
    </div>
    ${textField()}
    <p class="group-label">Progress</p>
    ${progressFields() || `<p class="muted">Nothing type-specific to track.</p>`}
    ${collectionFields() ? `<p class="group-label">Collection</p>${collectionFields()}` : ""}
    ${partialsHtml()}
    ${affinityNote()}
    <div class="savebar"><button type="button" class="solid" style="width:100%" data-act="save">${session.log ? "Update review" : "Save review"}</button></div>`;
}

function loginCard() {
  return `<div class="panel"><h2 class="display" style="font-size:22px">Log this</h2><p class="muted">Sign in to rate it, write it up, and keep a log.</p><button type="button" class="solid" data-act="nav" data-value="user">Log in</button></div>`;
}

function tabsHtml() {
  const media = mediaType();
  const tabs = [["review", "Review"]];
  if (media === "boardgames") tabs.push(["matches", "Matches"]);
  if (MARKET.has(media)) tabs.push(["market", "Market"]);
  if (tabs.length === 1) return "";
  return `<div class="seg" role="tablist">${tabs.map(([id, label]) => `<button type="button" role="tab" class="${session.tab === id ? "on" : ""}" data-act="tab" data-value="${id}">${label}</button>`).join("")}</div>`;
}

function matchesHtml() {
  const trend = session.matches.map((match) => {
    const winner = match.players.find((player) => player.winner);
    return winner ? winner.score : 0;
  });
  const max = Math.max(1, ...trend);
  const points = trend.map((score, index) => {
    const x = trend.length === 1 ? 50 : (index / (trend.length - 1)) * 100;
    const y = 32 - (score / max) * 28;
    return `${x},${y}`;
  }).join(" ");
  const trendSvg = trend.length ? `<svg class="trend" viewBox="0 0 100 36" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="2" points="${points}" /></svg>` : "";
  const cards = session.matches.map((match) => {
    const open = session.expandedMatch[match.id];
    const winner = match.players.find((player) => player.winner);
    return `<article class="review st-completed">
      <button type="button" class="linkish" data-act="expand-match" data-value="${match.id}">${esc(match.date)} · ${match.duration}m · ${winner ? esc(winner.name) + " won" : "No winner"}</button>
      ${open ? `<p style="margin:8px 0">${match.players.map((player) => `${esc(player.name)} ${player.score}${player.app ? " · on Geeklogs" : ""}`).join("<br>")}</p><p class="muted">${esc(match.notes)}</p><button type="button" class="ghost" data-act="ask-delete-match" data-value="${match.id}">Delete</button>${session.confirmDelete === match.id ? `<p>Delete this session?</p><button type="button" class="solid" data-act="delete-match" data-value="${match.id}">Delete</button>` : ""}` : ""}
    </article>`;
  }).join("");
  return `<p class="group-label">Score trend</p>${trendSvg || `<p class="muted">Play a session to see the trend.</p>`}
    ${session.celebrate ? `<div class="banner">Session saved. Nice table.</div>` : ""}
    <div class="actions"><button type="button" class="ghost" data-act="open-match">Add match</button></div>
    ${cards || `<p class="muted">No sessions yet.</p>`}`;
}

function marketHtml() {
  const listing = session.listing;
  if (listing && !session.listingEditing) {
    return `<article class="panel">
      <p class="eyebrow">${listing.published ? "Published" : "Draft"}</p>
      <h2 class="display" style="font-size:28px;margin-top:6px">$${esc(listing.price)}</h2>
      <p>${esc(listing.condition)} · ${esc(listing.notes)}</p>
      <div class="actions">
        <button type="button" class="ghost" data-act="edit-listing">Edit</button>
        <button type="button" class="ghost" data-act="toggle-listing">${listing.published ? "Unpublish" : "Publish"}</button>
        <button type="button" class="ghost" data-act="view-listing">View listing</button>
      </div>
      <button type="button" class="linkish" data-act="delete-listing">Delete listing</button>
    </article>`;
  }
  const draft = listing || { price: "", condition: "Good", notes: "" };
  return `<label class="field"><span>Price</span><input id="list-price" type="number" value="${esc(draft.price)}" /></label>
    <label class="field"><span>Condition</span><select id="list-condition">
      ${["New", "Good", "Played", "Worn"].map((condition) => `<option ${draft.condition === condition ? "selected" : ""}>${condition}</option>`).join("")}
    </select></label>
    <label class="field"><span>Notes</span><textarea id="list-notes">${esc(draft.notes)}</textarea></label>
    <div class="actions"><button type="button" class="solid" data-act="publish">Publish</button></div>`;
}

function logBlock(builder) {
  if (!authed()) return loginCard();
  const body = session.tab === "matches" ? matchesHtml() : session.tab === "market" ? marketHtml() : builder();
  return `<div class="panel">${tabsHtml()}<div style="margin-top:12px">${body}</div></div>`;
}

function scopeLabel(review) {
  if (review.scope === "episode") return `S${review.season}·E${review.episode}`;
  if (review.scope === "season") return `Season ${review.season}`;
  if (review.chapter) return `Ch ${review.chapter}${review.volume ? ` · Vol ${review.volume}` : ""}`;
  return "";
}

function reviewCard(review, extra) {
  const reaction = session.reactions[review.id] || null;
  const likes = review.likes + (reaction === "like" ? 1 : 0);
  const dislikes = review.dislikes + (reaction === "dislike" ? 1 : 0);
  const nameClass = review.admin ? "admin" : review.pro ? "pro" : "";
  const scope = scopeLabel(review);
  const level = session.levelFor === review.id ? `<div class="level-pop">Level ${review.level}. Community standing on Geeklogs.</div>` : "";
  return `<article class="review st-${statusKind(review.status)}">
    <div class="who">
      <div>
        <button type="button" class="linkish ${nameClass}" data-act="profile" data-value="${esc(review.user)}">${esc(review.user)}</button>
        <button type="button" class="badge" data-act="level" data-value="${review.id}">Lv ${review.level}</button>
        ${scope ? `<span class="badge">${esc(scope)}</span>` : ""}
        <span class="badge soft-${statusKind(review.status) === "completed" ? "ok" : statusKind(review.status) === "dropped" ? "danger" : statusKind(review.status) === "progress" ? "warn" : ""}">${esc(review.status)}</span>
      </div>
      <span class="stars">${starsText(review.grade)}</span>
    </div>
    ${level}
    <p style="margin:8px 0 0">${esc(review.text)}</p>
    <div class="muted" style="font-size:12px;margin-top:4px">${esc(review.date)}</div>
    <div class="reacts">
      <button type="button" class="ghost ${reaction === "like" ? "on" : ""}" data-act="react" data-id="${review.id}" data-value="like" ${authed() ? "" : "disabled"}>Like ${likes}</button>
      <button type="button" class="ghost ${reaction === "dislike" ? "on" : ""}" data-act="react" data-id="${review.id}" data-value="dislike" ${authed() ? "" : "disabled"}>Dislike ${dislikes}</button>
    </div>
    ${extra || ""}
  </article>`;
}

function sortedReviews() {
  const copy = [...session.reviews];
  if (session.sort === "oldest") copy.sort((a, b) => a.date.localeCompare(b.date));
  else if (session.sort === "likes") copy.sort((a, b) => b.likes - a.likes);
  else if (session.sort === "dislikes") copy.sort((a, b) => b.dislikes - a.dislikes);
  else copy.sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  return copy;
}

function grouped(list) {
  const media = mediaType();
  if (media !== "tv" && media !== "anime") return list.map((review) => ({ primary: review, rest: [] }));
  const groups = new Map();
  list.forEach((review) => {
    if (!groups.has(review.user)) groups.set(review.user, []);
    groups.get(review.user).push(review);
  });
  return [...groups.values()].map((group) => {
    const primary = group.find((review) => review.scope === "show") || group[0];
    return { primary, rest: group.filter((review) => review !== primary) };
  });
}

function reviewsHtml() {
  if (session.reviewsLoading) {
    return `<section><h2 class="display" style="font-size:22px">Reviews</h2><div class="panel"><p class="muted">Searching reviews…</p></div></section>`;
  }
  const groups = grouped(sortedReviews());
  const pages = Math.max(1, Math.ceil(groups.length / 10));
  if (session.page > pages) session.page = pages;
  const slice = groups.slice((session.page - 1) * 10, session.page * 10);
  const sort = `<label class="field"><span>Sort</span><select data-act="sort">
    ${[["recent", "Recent"], ["oldest", "Oldest"], ["likes", "Likes"], ["dislikes", "Dislikes"]].map(([id, label]) => `<option value="${id}" ${session.sort === id ? "selected" : ""}>${label}</option>`).join("")}
  </select></label>`;
  const cards = slice.map(({ primary, rest }) => {
    const more = rest.length ? `<button type="button" class="linkish" data-act="thread" data-value="${primary.id}">${session.expanded[primary.id] ? "Hide" : `${rest.length} more from ${esc(primary.user)}`}</button>` : "";
    const extra = session.expanded[primary.id] ? rest.map((review) => reviewCard(review)).join("") : "";
    return reviewCard(primary, more) + extra;
  }).join("");
  const empty = groups.length ? cards : `<div class="panel" style="text-align:center"><p>No reviews yet.</p></div>`;
  const pager = groups.length > 10 ? `<div class="pager"><button type="button" class="ghost" data-act="page" data-dir="-1" ${session.page === 1 ? "disabled" : ""}>Previous</button><span class="muted">${session.page} / ${pages}</span><button type="button" class="ghost" data-act="page" data-dir="1" ${session.page === pages ? "disabled" : ""}>Next</button></div>` : "";
  return `<section><h2 class="display" style="font-size:22px">Reviews</h2>${groups.length ? sort : ""}${empty}${pager}</section>`;
}

function backButton(className) {
  return `<button type="button" class="ghost ${className || ""}" data-act="back">${ICONS.back} Back</button>`;
}

function renderReskin() {
  const data = currentItem();
  return `<div class="stack reskin">
    <div>${backButton()}</div>
    <div class="hero-row">${poster(data)}<div class="meta">${heroBits(data)}</div></div>
    <article class="panel">${detailsInner(data)}</article>
    ${logBlock(formReskin)}
    ${reviewsHtml()}
  </div>`;
}

function renderRestructure() {
  const data = currentItem();
  const peers = [["log", "Log"], ["details", "Details"], ["reviews", "Reviews"]].map(([id, label]) =>
    `<button type="button" class="${section === id ? "on" : ""}" data-act="section" data-value="${id}">${label}</button>`).join("");
  let body = "";
  if (section === "details") body = `<article class="panel">${detailsInner(data)}</article>`;
  else if (section === "reviews") body = reviewsHtml();
  else body = logBlock(formRestructure);
  return `<div class="stack restructure">
    <div class="mast" style="--hue-n:${data.hue}">
      ${backButton("back")}
      ${heroBits(data)}
    </div>
    <div class="peers" role="tablist">${peers}</div>
    ${body}
  </div>`;
}

function skeletonReskin() {
  return `<div class="stack"><div class="skel" style="height:36px;width:88px"></div><div class="hero-row"><div class="skel" style="width:7rem;aspect-ratio:2/3"></div><div style="flex:1"><div class="skel" style="height:28px"></div><div class="skel" style="height:16px;margin-top:8px"></div></div></div><div class="skel" style="height:160px"></div><div class="skel" style="height:220px"></div></div>`;
}
function skeletonRestructure() {
  return `<div class="stack"><div class="skel" style="height:210px"></div><div class="skel" style="height:36px"></div><div class="skel" style="height:280px"></div></div>`;
}
function errorHtml() {
  return `<div class="panel"><h1 style="font-size:26px">Couldn't load this item</h1><p class="muted">The catalog didn't answer. You can try again, or go back.</p><div class="actions"><button type="button" class="solid" data-act="retry">Try again</button><button type="button" class="ghost" data-act="back">Back</button></div></div>`;
}

function matchSheet() {
  if (!session.matchOpen || !session.matchDraft) return "";
  const draft = session.matchDraft;
  const players = draft.players.map((player, index) => `<div class="player">
    <input data-player="${index}" data-key="name" value="${esc(player.name)}" aria-label="Name" />
    <input data-player="${index}" data-key="score" type="number" value="${esc(player.score)}" aria-label="Score" />
    <label><input type="radio" name="winner" data-act="winner" data-value="${index}" ${player.winner ? "checked" : ""}/> Win</label>
    <label><input type="checkbox" data-player="${index}" data-key="app" ${player.app ? "checked" : ""}/> App</label>
  </div>`).join("");
  return `<div class="sheet"><div class="card">
    <h2 class="display" style="font-size:24px;margin-top:0">Add match</h2>
    <div class="pair">
      <label class="field"><span>Date</span><input id="match-date" type="date" value="${esc(draft.date)}" /></label>
      <label class="field"><span>Minutes</span><input id="match-duration" type="number" value="${esc(draft.duration)}" /></label>
    </div>
    ${players}
    <button type="button" class="linkish" data-act="add-player">Add player</button>
    <label class="field"><span>Notes</span><textarea id="match-notes">${esc(draft.notes)}</textarea></label>
    <div class="actions">
      <button type="button" class="ghost" data-act="close-match">Cancel</button>
      <button type="button" class="ghost" data-act="save-match">Save</button>
      <button type="button" class="solid" data-act="save-match-celebrate">Save + celebrate</button>
    </div>
  </div></div>`;
}

function completeModal() {
  if (!session.completeOpen) return "";
  const data = currentItem();
  const bits = [];
  if (session.ownership) bits.push(session.ownership);
  if (mediaType() === "boardgames" && session.matchesPlayed) bits.push(`${session.matchesPlayed} matches`);
  return `<div class="modal-back"><div class="card">
    <h2 class="display" style="font-size:26px;margin-top:0">Logged ${esc(data.title)}</h2>
    <p class="muted">${bits.length ? esc(bits.join(" · ")) : "That's a finish."}</p>
    <label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" data-act="hide-complete" ${session.hideComplete ? "checked" : ""}/> Don't show this again</label>
    <div class="actions">
      <button type="button" class="ghost" data-act="close-complete">Stay</button>
      <button type="button" class="solid" data-act="complete-back">Done</button>
    </div>
  </div></div>`;
}

function renderBar() {
  const label = VARIANTS.find(([id]) => id === variant)[1];
  document.querySelector("#variant-label span").textContent = label;
  scenarioSelect.value = scenario;
  document.getElementById("phone-toggle").classList.toggle("on", phone);
  document.body.classList.toggle("phone", phone);
  const snap = {
    variant, scenario, section, phone,
    tab: session.tab, status: session.status, grade: session.grade,
    ownership: session.ownership, sort: session.sort, page: session.page,
    hasLog: Boolean(session.log), partials: session.partials.length,
    matches: session.matches.length, listing: session.listing ? (session.listing.published ? "published" : "draft") : "none",
  };
  document.getElementById("state-readout").textContent = JSON.stringify(snap, null, 2);
}

function render() {
  let html = "";
  if (scenario === "loading") html = variant === "reskin" ? skeletonReskin() : skeletonRestructure();
  else if (scenario === "error") html = errorHtml();
  else html = (variant === "reskin" ? renderReskin() : renderRestructure()) + matchSheet() + completeModal();
  document.getElementById("page").innerHTML = html;
  shellHtml();
  renderBar();
  writeUrl();
}

function cycle(dir) {
  const index = VARIANTS.findIndex(([id]) => id === variant);
  variant = VARIANTS[(index + dir + VARIANTS.length) % VARIANTS.length][0];
  render();
}

document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "cycle") cycle(Number(el.dataset.dir));
  else if (act === "phone") { phone = !phone; render(); }
  else if (act === "back") toast("Would go back");
  else if (act === "retry") loadScenario("movies");
  else if (act === "nav") toast(el.dataset.value === "user" && !authed() ? "Would open log in" : `Would open ${el.dataset.value}`);
  else if (act === "logout") { session.menuOpen = false; toast("Would log out"); }
  else if (act === "menu") { session.menuOpen = !session.menuOpen; render(); }
  else if (act === "theme") {
    document.documentElement.dataset.theme = el.dataset.value;
    render();
  } else if (act === "desc") { session.descriptionOpen = !session.descriptionOpen; render(); }
  else if (act === "star") { session.grade = Number(el.dataset.value) * 2; render(); }
  else if (act === "ownership") {
    session.ownership = session.ownership === el.dataset.value ? "" : el.dataset.value;
    render();
  } else if (act === "tab") { session.tab = el.dataset.value; render(); }
  else if (act === "section") { section = el.dataset.value; render(); }
  else if (act === "save") saveLog();
  else if (act === "partial") savePartial(el.dataset.value);
  else if (act === "delete-partial") {
    session.partials = session.partials.filter((partial) => partial.id !== el.dataset.value);
    render();
  } else if (act === "page") {
    session.page += Number(el.dataset.dir);
    session.expanded = {};
    render();
  } else if (act === "react") {
    if (!authed()) return;
    const id = el.dataset.id;
    session.reactions[id] = session.reactions[id] === el.dataset.value ? null : el.dataset.value;
    render();
  } else if (act === "thread") {
    session.expanded[el.dataset.value] = !session.expanded[el.dataset.value];
    render();
  } else if (act === "level") {
    session.levelFor = session.levelFor === el.dataset.value ? null : el.dataset.value;
    render();
  } else if (act === "profile") toast(`Would open /${el.dataset.value}?category=${mediaType()}`);
  else if (act === "open-match") openMatch();
  else if (act === "close-match") { session.matchOpen = false; render(); }
  else if (act === "add-player") {
    readMatchDraft();
    session.matchDraft.players.push({ name: "", score: "", winner: false, app: false });
    render();
  } else if (act === "winner") {
    readMatchDraft();
    session.matchDraft.players.forEach((player, index) => { player.winner = String(index) === el.dataset.value; });
    render();
  } else if (act === "save-match" || act === "save-match-celebrate") {
    readMatchDraft();
    saveMatch(act === "save-match-celebrate");
  } else if (act === "expand-match") {
    session.expandedMatch[el.dataset.value] = !session.expandedMatch[el.dataset.value];
    render();
  } else if (act === "ask-delete-match") { session.confirmDelete = el.dataset.value; render(); }
  else if (act === "delete-match") {
    session.matches = session.matches.filter((match) => match.id !== el.dataset.value);
    session.matchesPlayed = String(session.matches.length);
    session.confirmDelete = null;
    render();
  } else if (act === "edit-listing") { session.listingEditing = true; render(); }
  else if (act === "toggle-listing") {
    session.listing.published = !session.listing.published;
    toast(session.listing.published ? "Listing published" : "Listing unpublished");
    render();
  } else if (act === "view-listing") toast("Would open the listing");
  else if (act === "delete-listing") { session.listing = null; session.listingEditing = false; toast("Listing deleted"); render(); }
  else if (act === "publish") {
    session.listing = {
      price: document.getElementById("list-price").value || "0",
      condition: document.getElementById("list-condition").value,
      notes: document.getElementById("list-notes").value,
      published: true,
    };
    session.listingEditing = false;
    toast("Listing published");
    render();
  } else if (act === "close-complete") { session.completeOpen = false; render(); }
  else if (act === "complete-back") { session.completeOpen = false; toast("Would go back"); render(); }
});

document.addEventListener("change", (event) => {
  const el = event.target;
  if (el.dataset.act === "scenario") loadScenario(el.value);
  else if (el.dataset.act === "sort") { session.sort = el.value; session.page = 1; session.expanded = {}; render(); }
  else if (el.dataset.act === "status") applyStatus(el.value);
  else if (el.dataset.act === "hide-complete") session.hideComplete = el.checked;
  else if (el.dataset.field) session[el.dataset.field] = el.value;
  else if (el.dataset.player) updatePlayer(el);
});

document.addEventListener("input", (event) => {
  const el = event.target;
  if (el.dataset.field) session[el.dataset.field] = el.value;
  else if (el.dataset.player) updatePlayer(el);
  else if (el.id === "match-date" || el.id === "match-duration" || el.id === "match-notes") readMatchDraft();
  const pre = document.getElementById("state-readout");
  if (pre && session) pre.textContent = JSON.stringify({ status: session.status, grade: session.grade, ownership: session.ownership, tab: session.tab }, null, 2);
});

function updatePlayer(el) {
  const player = session.matchDraft.players[Number(el.dataset.player)];
  if (el.dataset.key === "app") player.app = el.checked;
  else player[el.dataset.key] = el.value;
}
function readMatchDraft() {
  if (!session.matchDraft) return;
  const date = document.getElementById("match-date");
  const duration = document.getElementById("match-duration");
  const notes = document.getElementById("match-notes");
  if (date) session.matchDraft.date = date.value;
  if (duration) session.matchDraft.duration = duration.value;
  if (notes) session.matchDraft.notes = notes.value;
}

document.addEventListener("keydown", (event) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (event.key === "ArrowLeft") cycle(-1);
  if (event.key === "ArrowRight") cycle(1);
});

const scroll = document.getElementById("scroll");
let pullY = null;
scroll.addEventListener("pointerdown", (event) => {
  if (scroll.scrollTop <= 0) pullY = event.clientY;
});
scroll.addEventListener("pointerup", (event) => {
  if (pullY != null && event.clientY - pullY > 64 && scroll.scrollTop <= 0) refresh();
  pullY = null;
});

loadScenario(scenario);
</script>
